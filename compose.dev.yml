# Development override for the same deployment services in compose.yml.
# It keeps the internal celld listener private and only enables more verbose
# runtime logs. The deploy service still runs to completion before celld starts.
services:
  deploy:
    environment:
      RUST_LOG: ${RUST_LOG:-debug}

  celld:
    environment:
      RUST_LOG: ${RUST_LOG:-debug}
    restart: "no"
